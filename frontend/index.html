<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>restic-gui</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="policy.css"><link rel="stylesheet" href="snapshot.css"></head>
<body><div class="shell"><aside><div class="brand"><b>R</b> restic-gui</div><nav><button class="nav" data-page="repositories">▣　Repository</button><button class="nav" data-page="policies">▤　BackupPolicy</button><button class="nav" data-page="forget">⌫　ForgetPolicy</button><button class="nav" data-page="logs">≡　Logs</button><button class="nav" data-page="config">⚙　Configuration</button><button class="nav" data-page="manual">▶　Manual Backup</button></nav><small>안전하고 간편한 백업</small></aside>
<main><header><div><em>RESTIC BACKUP</em><h1 id="title">저장소</h1></div><button class="primary" id="create"></button></header><p class="intro" id="intro"></p><div id="notice" class="error" hidden></div><section id="list" class="grid"></section><section id="empty" class="empty" hidden><h2>등록된 항목이 없습니다</h2><p>새 항목을 만들어 시작해 보세요.</p></section></main></div>
<div id="modal" class="modal" hidden><div class="backdrop" data-close></div><form id="form" class="dialog"><div class="dialog-head"><div><em>RESTIC GUI</em><h2 id="modal-title"></h2></div><button type="button" class="close" data-close>×</button></div><div id="fields"></div><p id="form-error" class="error" hidden></p><div class="actions"><button type="button" class="secondary" data-close>취소</button><button class="primary">확인</button></div></form></div>
<div id="file-modal" class="modal nested" hidden><div class="backdrop" data-file-close></div><section class="dialog"><div class="dialog-head"><div><em>POLICY FILE</em><h2 id="file-modal-title"></h2></div><button type="button" class="close" data-file-close>×</button></div><p id="file-path" class="file-path"></p><label for="file-content">내용</label><textarea id="file-content" class="file-editor"></textarea><div class="actions"><button type="button" class="secondary" data-file-close>취소</button><button type="button" class="primary" id="save-file-content">적용</button></div></section></div>
<div id="progress-modal" class="modal" hidden><div class="backdrop"></div><section class="dialog progress-dialog" role="status" aria-live="polite"><em>MANUAL BACKUP</em><h2 id="progress-title">백업을 실행하고 있습니다</h2><p id="progress-message">백업 준비 중…</p><div class="progress-track"><div class="progress-bar"></div></div><strong id="progress-percent">0%</strong><p id="progress-detail" class="progress-detail"></p><p id="progress-file" class="progress-file"></p><button id="progress-close" type="button" class="primary" hidden>확인</button></section></div>
<link rel="stylesheet" href="progress.css"><script src="app.js"></script></body></html>
